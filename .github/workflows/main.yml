name: Crear HerramientasPDF.exe

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Tesseract (OCR)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $td = "C:\Program Files\Tesseract-OCR\tessdata"
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/spa.traineddata" -OutFile "$td\spa.traineddata"

      - name: Crear la aplicación
        shell: pwsh
        run: |
          pyinstaller herramientas_pdf.py --noconfirm --windowed --onedir --name HerramientasPDF `
            --icon app/icon.ico --add-data "app/web;app/web" `
            --collect-all webview --collect-all clr_loader --collect-all pythonnet --collect-all pikepdf --collect-all fitz --collect-all pdf2docx `
            --collect-all pdfplumber --collect-all pdfminer --collect-all pypdfium2 --collect-all openpyxl `
            --hidden-import pillow_heif --hidden-import tkinter --hidden-import app.extra

      - name: Comprobar que arranca
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0,'.'); import app.api, app.core, app.extra, pdfplumber, openpyxl, numpy; print('modulos OK')"
          Get-ChildItem dist\HerramientasPDF | Select-Object -First 15

      - name: Añadir Tesseract
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\Tesseract-OCR") {
            Copy-Item "C:\Program Files\Tesseract-OCR" "dist\HerramientasPDF\tesseract" -Recurse
          }

      - name: Comprimir (versión portátil)
        shell: pwsh
        run: Compress-Archive -Path dist\HerramientasPDF -DestinationPath HerramientasPDF-Portatil.zip

      - name: Crear instalador (un solo .exe con acceso directo en el escritorio)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          Get-ChildItem installer

      - uses: actions/upload-artifact@v4
        with:
          name: HerramientasPDF-Instalador
          path: installer/HerramientasPDF-Instalador.exe

      - uses: actions/upload-artifact@v4
        with:
          name: HerramientasPDF-Portatil
          path: HerramientasPDF-Portatil.zip
